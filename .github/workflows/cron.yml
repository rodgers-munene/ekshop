name: Scheduled cron jobs

on:
  schedule:
    # Daily admin report - 3:00 AM UTC = 6:00 AM EAT
    - cron: "0 3 * * *"
    # Weekly admin report - Monday 4:00 AM UTC = 7:00 AM EAT
    - cron: "0 4 * * 1"
    # Monthly admin report - 1st of month 4:00 AM UTC = 7:00 AM EAT
    - cron: "0 4 1 * *"
    # Weekly insight digest - Monday 4:00 AM UTC = 7:00 AM EAT
    - cron: "0 4 * * 1"
    # eTIMS queue processing - every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Guard against missing backend URL
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "::error::BACKEND_BASE_URL secret is not set"
            exit 1
          fi

      - name: Send daily admin report
        if: ${{ github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          curl -sf -X POST "$BACKEND_BASE_URL/internal/cron/admin/daily-report" \
            -H "X-Cron-Secret: $CRON_SECRET"

      - name: Send weekly admin report
        if: ${{ github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch' }}
        run: |
          curl -sf -X POST "$BACKEND_BASE_URL/internal/cron/admin/weekly-report" \
            -H "X-Cron-Secret: $CRON_SECRET"

      - name: Send monthly admin report
        if: ${{ github.event.schedule == '0 4 1 * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          curl -sf -X POST "$BACKEND_BASE_URL/internal/cron/admin/monthly-report" \
            -H "X-Cron-Secret: $CRON_SECRET"

      - name: Send weekly insight digest
        if: ${{ github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch' }}
        run: |
          curl -sf -X POST "$BACKEND_BASE_URL/internal/cron/admin/weekly-insight-digest" \
            -H "X-Cron-Secret: $CRON_SECRET"

      - name: Process eTIMS queue
        if: ${{ github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          curl -sf -X POST "$BACKEND_BASE_URL/internal/cron/etims-process-queue" \
            -H "X-Cron-Secret: $CRON_SECRET"