name: Deploy backend to AWS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write # required for AWS OIDC auth
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ekshop-backend

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: alembic upgrade head

  build-and-deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # No SSH key, no open port 22: the deploy script runs on the instance
      # via Systems Manager Run Command, authorized purely through IAM.
      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          SECRET_ARN: ${{ secrets.SECRETS_MANAGER_ARN }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          cat > /tmp/deploy.sh <<EOF
          set -euo pipefail
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
          docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
          aws secretsmanager get-secret-value --region ${AWS_REGION} --secret-id ${SECRET_ARN} --query SecretString --output text | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(f'{k}={v}' for k,v in d.items()))" > /etc/ekshop-backend.env
          chmod 600 /etc/ekshop-backend.env
          docker stop ekshop-backend >/dev/null 2>&1 || true
          docker rm ekshop-backend >/dev/null 2>&1 || true
          docker run -d --name ekshop-backend --restart unless-stopped -p 127.0.0.1:8000:8000 --env-file /etc/ekshop-backend.env \
            --log-driver=awslogs --log-opt awslogs-region=${AWS_REGION} --log-opt awslogs-group=/ekshop/backend --log-opt awslogs-stream=backend \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
          docker image prune -af --filter "until=72h" >/dev/null 2>&1 || true
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters "{\"commands\":$(jq -Rs 'split("\n")' /tmp/deploy.sh)}" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 30); do
            sleep 6
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Deploy status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
            esac
          done
          echo "Timed out waiting for the deploy command to finish"
          exit 1
