name: Reconcile stale M-Pesa payment intents

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call mpesa-reconcile endpoint
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_BASE_URL }}/internal/cron/mpesa-reconcile" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
